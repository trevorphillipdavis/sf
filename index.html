<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify playlist viewer</title><meta name="description" content="View a Spotify playlist and its songs from a link."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231DB954'/%3E%3Cpath d='M14 24c13-4 28-2 39 4M16 34c12-3 25-1 35 4M19 44c9-2 19-1 28 3' fill='none' stroke='%230c1a13' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"><style>:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eef8f0;background:#0b1210}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#1c3a2b 0%,transparent 42%),#0b1210}.wrap{max-width:850px;margin:0 auto;padding:48px 24px 100px}header{display:flex;align-items:center;gap:14px;margin-bottom:48px}.brand{width:42px;height:42px;border-radius:12px;background:#1db954;display:grid;place-items:center;color:#09140d;font-size:23px;font-weight:900}header strong{font-size:19px;letter-spacing:-.02em}h1{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.055em;line-height:1.07;margin:0 0 14px}p{color:#adc0b3;line-height:1.5;margin:0 0 28px}.panel{background:#14201a;border:1px solid #30513b;border-radius:20px;padding:26px;box-shadow:0 16px 50px #0004}label{display:block;font-weight:650;margin-bottom:10px}input{width:100%;min-height:50px;border:1px solid #57715e;border-radius:10px;background:#0d1711;color:white;font:inherit;padding:12px 14px;outline:none}input:focus{border-color:#1ed760;box-shadow:0 0 0 3px #1db95444}.row{display:flex;gap:10px}.row input{flex:1;min-width:0}button{background:#1ed760;border:0;border-radius:10px;color:#092010;font:inherit;font-weight:750;padding:12px 22px;cursor:pointer;white-space:nowrap}button:hover{background:#51ee83}.status{margin:14px 0 0;color:#ffcb9c}.results{margin-top:30px}.results h2{font-size:22px;letter-spacing:-.02em}.description{margin:10px 0 14px;color:#cfdfd2;white-space:pre-wrap}.full-link{display:inline-block;margin:0 0 18px;color:#66e995;font-weight:600}.results iframe{display:block;width:100%;height:620px;border:0;border-radius:16px;background:#202820}@media(max-width:580px){.wrap{padding:28px 16px 70px}header{margin-bottom:40px}.panel{padding:18px}.row{flex-direction:column}button{min-height:50px}.results iframe{height:540px}}</style></head><body><main class="wrap"><header><div class="brand" aria-hidden="true">♫</div><strong>Playlist viewer</strong></header><h1>What’s on that playlist?</h1><p>Paste a public Spotify playlist link to see its name, songs, and artists.</p><section class="panel"><form id="form"><label for="url">Spotify playlist URL</label><div class="row"><input id="url" type="url" placeholder="https://open.spotify.com/playlist/..." required autocomplete="url"><button type="submit">Show playlist</button></div></form><div id="status" class="status" role="status" aria-live="polite"></div></section><section class="results" id="results" hidden><h2 id="playlist-name">Loading playlist…</h2><p id="description" class="description" aria-live="polite"></p><a id="full-link" class="full-link" target="_blank" rel="noopener">Open the full playlist on Spotify</a><iframe id="player" title="Spotify playlist songs and artists" loading="eager" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></section></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('url').value.trim(),status=document.getElementById('status');let id;try{const u=new URL(input);if(!['open.spotify.com','spotify.com'].includes(u.hostname))throw Error();id=u.pathname.match(/^\/(?:intl-[a-z]{2}\/)?playlist\/([a-zA-Z0-9]{22})\/?$/)?.[1];if(!id)throw Error()}catch{status.textContent='Enter a valid Spotify playlist URL.';document.getElementById('results').hidden=true;return}status.textContent='';document.getElementById('player').src='https://open.spotify.com/embed/playlist/'+id+'?utm_source=generator&theme=0';document.getElementById('results').hidden=false;document.getElementById('full-link').href='https://open.spotify.com/playlist/'+id;const title=document.getElementById('playlist-name'),description=document.getElementById('description');title.textContent='Loading playlist…';description.textContent='Loading description…';try{const response=await fetch('https://spotify-playlist-viewer-trevor.trevor-davis36532.chatgpt.site/api/playlist/'+id);if(!response.ok)throw Error('Description unavailable for this playlist.');const data=await response.json();title.textContent=data.name||'Playlist';description.textContent=data.description||'No description provided.'}catch{title.textContent='Playlist';description.textContent='Description unavailable for this playlist.'}});</script></body></html>
